# Landing page do Syncrofin 3D Planner em syncrofin.com.br/planner
# Subir/atualizar (na pasta landing/):  docker compose up -d --build
# Passo a passo completo em DEPLOY.md.
services:
  planner-landing:
    build: .
    image: planner-landing:latest
    container_name: planner-landing
    restart: unless-stopped
    # Sem porta no host: o Caddy alcanca o container pelo nome, na rede abaixo.
    # Para testar: docker exec syncrofin-pessoal-caddy-1 wget -qO- http://planner-landing/planner/
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # A rede do Caddy que atende syncrofin.com.br (mesma usada pelo pdv-lev-landing).
    networks:
      - default
      - syncrofin

networks:
  syncrofin:
    external: true
    name: syncrofin-pessoal_default
