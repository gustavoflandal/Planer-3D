server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Redirecionamentos relativos: o nginx nao sabe que esta atras de HTTPS,
    # entao "Location: /planner/" deixa o navegador manter https://...
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Sem a barra final os caminhos relativos (img/..., ajuda/...) quebram.
    location = /planner {
        return 301 /planner/;
    }
    location = /planner/ajuda {
        return 301 /planner/ajuda/;
    }

    location /planner/ {
        try_files $uri $uri/ =404;
    }

    # Imagens mudam pouco; o HTML pode mudar sem trocar de nome.
    location ~* ^/planner/.+\.(jpg|jpeg|png|webp|svg|woff2)$ {
        expires 30d;
        access_log off;
    }
}
